# This tmux statusbar config was created by tmuxline.vim
# on Wed, 17 Aug 2016

set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=colour237,bg=colour101"
set -g status-right-style "none"
set -g pane-active-border-style "fg=colour101"
set -g status-style "none,bg=colour237"
set -g message-style "fg=colour237,bg=colour101"
set -g pane-border-style "fg=colour236"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=colour101,bg=colour237"

set -g status-left "#[fg=colour237,bg=colour101,bold] #S #[fg=colour101,bg=colour237,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=colour238,bg=colour237,nobold,nounderscore,noitalics]#[fg=colour101,bg=colour238] %Y-%m-%d  %H:%M #[fg=colour101,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour237,bg=colour101] #h "
setw -g window-status-format "#[fg=colour101,bg=colour237] #I #[fg=colour101,bg=colour237] #W "
setw -g window-status-current-format "#[fg=colour237,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour101,bg=colour238] #I #[fg=colour101,bg=colour238] #W #[fg=colour238,bg=colour237,nobold,nounderscore,noitalics]"
